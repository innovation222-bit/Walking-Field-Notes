name: Auto-Generate Sitemap

on:
  push:
    branches: [ main, master ]

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Sitemap XML
        run: |
          python -c '
          import os
          import datetime

          domain = "https://learn.ca"
          today = datetime.date.today().isoformat()

          # Base root URL
          urls = [f"{domain}/"]

          # Scan root directory for markdown stones
          for f in sorted(os.listdir(".")):
              if f.endswith(".md") and f.lower() != "readme.md":
                  urls.append(f"{domain}/{f}")

          # Build XML structure
          xml = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n"
          xml += "<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n"
          for url in urls:
              xml += f"  <url>\n    <loc>{url}</loc>\n    <lastmod>{today}</lastmod>\n  </url>\n"
          xml += "</urlset>"

          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write(xml)
          print("Successfully generated sitemap.xml with {} URLs.".format(len(urls)))
          '

      - name: Commit and Push Sitemap if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate sitemap.xml [skip ci]" && git push)
